# config/nats-server.conf

# サーバー情報
server_name: nats-tls-local

# ポート設定
port: 4222
http_port: 8222

# TLS設定
tls {
    cert_file: "/etc/nats/certs/nats-server-cert.pem"
    key_file: "/etc/nats/certs/nats-server-key.pem"
    ca_file: "/etc/nats/certs/ca.pem"
    
    # クライアント証明書の検証（相互TLS認証）
    verify: true
    
    # 接続タイムアウト
    timeout: 5
}

# 認証設定（開発環境用）
authorization {
    users = [
        {
            user: "test-user"
            password: "test-password"
        }
    ]
}

# JetStream有効化
jetstream {
    store_dir: "/data/jetstream"
    max_memory_store: 512MB
    max_file_store: 1GB
}

# ロギング
debug: true
trace: false
logtime: true

# 制限設定
max_connections: 100
max_payload: 1MB
max_pending: 10MB